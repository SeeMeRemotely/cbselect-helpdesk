server {
    listen 80;
    server_name helpdesk.cbselect.com;  # ← change to your domain

    # Redirect all HTTP to HTTPS (Certbot will add this automatically)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name helpdesk.cbselect.com;  # ← change to your domain

    # SSL certs managed by Certbot — it will fill these in
    # ssl_certificate /etc/letsencrypt/live/helpdesk.cbselect.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/helpdesk.cbselect.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}
